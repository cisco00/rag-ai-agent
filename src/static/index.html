<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Analytics Portal (React)</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- UI Tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grad-text {
            background: linear-gradient(to right, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-950 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const AuthOverlay = ({ onAuthSuccess }) => {
            const [isReg, setIsReg] = useState(false);
            const [val, setVal] = useState('');
            const [error, setError] = useState('');

            const handleLogin = () => {
                if (val) {
                    localStorage.setItem('X-API-KEY', val);
                    onAuthSuccess(val);
                }
            };

            const handleReg = async () => {
                try {
                    const res = await fetch('/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: val })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('X-API-KEY', data.api_key);
                        onAuthSuccess(data.api_key);
                    } else {
                        setError(data.detail || 'Registration failed');
                    }
                } catch (e) {
                    setError('Network error');
                }
            };

            return (
                <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-6">
                    <div className="glass max-w-md w-full p-10 rounded-[2rem] text-center shadow-2xl">
                        <h2 className="font-outfit text-3xl font-bold mb-4">{isReg ? 'Create Account' : 'Secure Access'}</h2>
                        <p className="text-slate-400 mb-8">{isReg ? 'Enter your organization name to begin.' : 'Please enter your X-API-KEY to proceed.'}</p>

                        {error && <div className="bg-red-500/20 text-red-300 border border-red-500/30 p-3 rounded-lg text-sm mb-6">{error}</div>}

                        <input
                            type="text"
                            className="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-white mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                            placeholder={isReg ? 'Organization Name' : 'X-API-KEY'}
                            value={val}
                            onChange={(e) => setVal(e.target.value)}
                        />

                        <button
                            onClick={isReg ? handleReg : handleLogin}
                            className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1"
                        >
                            {isReg ? 'Register' : 'Access Portal'}
                        </button>

                        <p className="mt-8 text-sm text-slate-400">
                            {isReg ? 'Already have a key?' : "Don't have an account?"} {' '}
                            <button onClick={() => { setIsReg(!isReg); setVal(''); setError(''); }} className="text-cyan-400 hover:underline">
                                {isReg ? 'Go back' : 'Register here'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ apiKey, onClose, onRefresh }) => {
            const [conn, setConn] = useState('');
            const [status, setStatus] = useState({ type: '', msg: '' });

            const handleSave = async () => {
                try {
                    const res = await fetch('/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-API-KEY': apiKey },
                        body: JSON.stringify({ connection_string: conn })
                    });
                    if (res.ok) {
                        setStatus({ type: 'success', msg: 'Database connected successfully!' });
                        onRefresh();
                    } else {
                        const data = await res.json();
                        setStatus({ type: 'error', msg: data.detail || 'Connection failed' });
                    }
                } catch (e) {
                    setStatus({ type: 'error', msg: 'Network error' });
                }
            };

            return (
                <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-6">
                    <div className="glass max-w-xl w-full p-8 rounded-[1.5rem] shadow-2xl">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="font-outfit text-2xl font-bold text-cyan-400">⚙️ Organization Settings</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
                        </div>

                        {status.msg && (
                            <div className={`${status.type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-red-500/20 text-red-300 border-red-500/30'} border p-4 rounded-xl mb-6 text-sm`}>
                                {status.msg}
                            </div>
                        )}

                        <div className="mb-8">
                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Database Connection String</label>
                            <input
                                type="text"
                                className="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="sqlite:///identifier.sqlite.db"
                                value={conn}
                                onChange={(e) => setConn(e.target.value)}
                            />
                            <p className="text-[11px] text-slate-500 mt-2">Example: postgresql://user:pass@localhost:5432/dbname</p>
                        </div>

                        <div className="flex gap-4">
                            <button onClick={handleSave} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all">Save Config</button>
                            <button onClick={onClose} className="flex-1 border border-white/10 text-slate-300 hover:bg-white/5 font-bold py-3 rounded-xl transition-all">Cancel</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('X-API-KEY'));
            const [showSettings, setShowSettings] = useState(false);
            const [tables, setTables] = useState({});
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const chartRef = useRef(null);
            const myChart = useRef(null);

            const loadTables = async (key) => {
                try {
                    const res = await fetch('/tables', { headers: { 'X-API-KEY': key } });
                    if (res.status === 401) { logout(); return; }
                    const data = await res.json();
                    if (res.ok) setTables(data.schemas);
                } catch (e) { console.error('Failed to load tables', e); }
            };

            const logout = () => {
                localStorage.removeItem('X-API-KEY');
                setApiKey(null);
            };

            useEffect(() => {
                if (apiKey) loadTables(apiKey);
            }, [apiKey]);

            const runAnalysis = async () => {
                if (!query) return;
                setLoading(true);
                setResult(null);
                try {
                    const res = await fetch('/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-API-KEY': apiKey },
                        body: JSON.stringify({ query })
                    });
                    if (res.status === 401) { logout(); return; }
                    const data = await res.json();
                    if (res.ok) {
                        setResult(data);
                    } else {
                        alert(data.detail || 'Analysis failed');
                    }
                } catch (e) {
                    alert('Network error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (result?.visualization && chartRef.current) {
                    if (myChart.current) myChart.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    const isPie = result.visualization.type === 'pie';
                    const colors = ['#6366f1', '#22d3ee', '#818cf8', '#a78bfa', '#f472b2'];

                    myChart.current = new Chart(ctx, {
                        type: result.visualization.type,
                        data: {
                            labels: result.visualization.labels,
                            datasets: [{
                                label: 'Value',
                                data: result.visualization.data,
                                backgroundColor: isPie ? colors : colors[0],
                                borderColor: 'rgba(255, 255, 255, 0.1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: isPie, labels: { color: '#94a3b8' } } },
                            scales: isPie ? {} : {
                                y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#94a3b8' } },
                                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                            }
                        }
                    });
                }
            }, [result]);

            if (!apiKey) return <AuthOverlay onAuthSuccess={setApiKey} />;

            return (
                <div className="container mx-auto px-6 py-12">
                    <header className="flex flex-col items-center mb-16 relative">
                        <h1 className="font-outfit text-5xl font-bold grad-text mb-2">Commercial Analytics Portal</h1>
                        <p className="text-slate-400 text-lg">AI-Powered Insights for Your Organization</p>
                        <button
                            onClick={() => setShowSettings(true)}
                            className="absolute right-0 top-1/2 -translate-y-1/2 p-3 glass rounded-full hover:scale-110 transition-transform text-2xl"
                        >
                            ⚙️
                        </button>
                    </header>

                    <div className="flex items-center gap-4 mb-8 text-xs font-bold text-slate-500">
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            API System Active
                        </div>
                        <div className="flex-1 h-px bg-white/5"></div>
                        <button onClick={logout} className="text-cyan-400 hover:text-cyan-300">Change API Key</button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Sidebar */}
                        <aside className="space-y-8">
                            <div className="glass p-8 rounded-3xl shadow-xl">
                                <h3 className="font-outfit text-xl font-bold mb-6 text-indigo-400">🔍 Query Agent</h3>
                                <textarea
                                    className="w-full bg-slate-900/50 border border-white/10 rounded-2xl p-4 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-6"
                                    rows="4"
                                    placeholder="e.g. Which salesperson closed the most orders?"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                ></textarea>
                                <button
                                    disabled={loading}
                                    onClick={runAnalysis}
                                    className={`w-full py-4 rounded-xl font-bold text-white shadow-xl transition-all ${loading ? 'bg-slate-700' : 'bg-indigo-600 hover:bg-indigo-500 transform hover:-translate-y-1'}`}
                                >
                                    {loading ? 'Analyzing Data...' : 'Run Intelligence'}
                                </button>
                            </div>

                            <div className="glass p-8 rounded-3xl shadow-xl">
                                <h3 className="font-outfit text-xl font-bold mb-6 text-cyan-400">📊 Data Context</h3>
                                <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                                    {Object.entries(tables).length > 0 ? (
                                        Object.entries(tables).map(([name, cols]) => (
                                            <div key={name} className="border-b border-white/5 pb-4 last:border-0">
                                                <div className="font-bold text-slate-200 flex items-center gap-2">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-500/50"></span>
                                                    {name}
                                                </div>
                                                <div className="text-[10px] uppercase font-bold text-slate-500 mt-1 tracking-widest leading-relaxed">
                                                    {cols.map(c => c[0]).join(', ')}
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-slate-500 text-sm">No tables loaded. Configure a database.</div>
                                    )}
                                </div>
                            </div>
                        </aside>

                        {/* Main Result */}
                        <main className="lg:col-span-2">
                            {result ? (
                                <div className="glass p-10 rounded-3xl shadow-2xl space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700">
                                    <h3 className="font-outfit text-2xl font-bold text-emerald-400 flex items-center gap-3">
                                        ✨ Analyst Findings
                                    </h3>
                                    <div className="text-slate-200 text-lg leading-relaxed whitespace-pre-wrap">
                                        {result.response}
                                    </div>
                                    {result.visualization && (
                                        <div className="bg-slate-900/40 p-6 rounded-2xl border border-white/5 shadow-inner">
                                            <canvas ref={chartRef}></canvas>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="h-full min-h-[400px] border-2 border-dashed border-white/5 rounded-3xl flex flex-col items-center justify-center text-slate-600 p-12 text-center">
                                    <div className="text-6xl mb-6">🧠</div>
                                    <div className="font-outfit text-2xl mb-2">Awaiting Instructions</div>
                                    <p className="max-w-xs">Enter a query on the left to activate the Senior Analyst persona.</p>
                                </div>
                            )}
                        </main>
                    </div>

                    {showSettings && <SettingsModal apiKey={apiKey} onClose={() => setShowSettings(false)} onRefresh={() => loadTables(apiKey)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
