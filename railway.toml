[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
# Platform signals — do NOT override these in the Railway dashboard
ENVIRONMENT  = "production"
LLM_PROVIDER = "google"
LLM_MODEL_NAME = "gemini-1.5-pro"

# Set these secrets in Railway's Variables dashboard:
# JWT_SECRET       = "a-long-random-secret-string"
# APP_URL          = "https://your-frontend.vercel.app"
# ENCRYPTION_KEY   = "<fernet-key>"   (generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
# Optional overrides (uncomment to use a different LLM):
# OPENAI_API_KEY   = "sk-..."          (switches provider to OpenAI automatically)
# ANTHROPIC_API_KEY= "sk-ant-..."      (switches provider to Anthropic automatically)
# GOOGLE_API_KEY   = "AIza..."         (override the built-in Gemini key)
