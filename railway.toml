[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "uvicorn api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# NOTE: Railway does not honour [deploy.env] as env-var defaults.
# Production defaults (ENVIRONMENT, LLM_PROVIDER, LLM_MODEL_NAME) are
# set via Dockerfile ENV instructions instead.
#
# Set these secrets in Railway's Variables dashboard:
# JWT_SECRET       = "a-long-random-secret-string"
# APP_URL          = "https://your-frontend.vercel.app"
# ENCRYPTION_KEY   = "<fernet-key>"   (generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#
# Optional LLM overrides (dashboard only — override the built-in Gemini key):
# OPENAI_API_KEY   = "sk-..."        → automatically switches provider to OpenAI
# ANTHROPIC_API_KEY= "sk-ant-..."    → automatically switches provider to Anthropic
# GOOGLE_API_KEY   = "AIza..."       → overrides the built-in Gemini key
