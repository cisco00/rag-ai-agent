[package]
name = "vantage-ai-desktop"
version = "2.6.0"
edition = "2021"
description = "Vantage AI — AI-powered analytics desktop application"
authors = ["Vantage AI"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
portpicker = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
