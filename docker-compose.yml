services:
  # Fresh PostgreSQL Database
  # Access at: localhost:5435
  vantage-db:
    image: postgres:15-alpine
    container_name: vantage_postgres_fresh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vantage_db
    ports:
      - "5435:5432" # Mapped to 5435 to avoid conflict with local postgres
    volumes:
      - vantage_pg_data_fresh:/var/lib/postgresql/data
    restart: unless-stopped

  vantage-mysql:
    image: mysql:8.0
    container_name: vantage_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3307:3306"
    volumes:
      - vantage_mysql_data:/var/lib/mysql
    restart: unless-stopped

  vantage-mariadb:
    image: mariadb:latest
    container_name: vantage_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3308:3306"
    volumes:
      - vantage_mariadb_data:/var/lib/mysql
    restart: unless-stopped

  vantage-backend:
    build: ./backend
    container_name: vantage_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@vantage-db:5432/vantage_db
      - ADMIN_DB_PATH=/app/admin.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    depends_on:
      - vantage-db
    volumes:
      - ./backend:/app # Mount for development
    restart: unless-stopped

  vantage-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: vantage_frontend
    ports:
      - "5173:80"
    environment:
      - PORT=80
    depends_on:
      - vantage-backend
    restart: unless-stopped

volumes:
  vantage_pg_data_fresh:
  vantage_mysql_data:
  vantage_mariadb_data:
