services:
  vantage-db:
    image: postgres:15-alpine
    container_name: vantage_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vantage_db
    ports:
      - "5432:5432"
    volumes:
      - vantage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-mysql:
    image: mysql:8.0
    container_name: vantage_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3306:3306"
    volumes:
      - vantage_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-mariadb:
    image: mariadb:latest
    container_name: vantage_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3307:3306"
    volumes:
      - vantage_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-backend:
    build: ./backend
    container_name: vantage_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@vantage-db:5432/vantage_db
      - ADMIN_DB_PATH=/app/admin.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    depends_on:
      vantage-db:
        condition: service_healthy
      vantage-mysql:
        condition: service_healthy
      vantage-mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  vantage-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: vantage_frontend
    ports:
      - "5173:80"
    environment:
      - PORT=80
    depends_on:
      - vantage-backend
    restart: unless-stopped

volumes:
  vantage_pg_data:
  vantage_mysql_data:
  vantage_mariadb_data: