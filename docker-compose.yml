services:
  vantage-db:
    image: postgres:15-alpine
    container_name: vantage_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vantage_db
    ports:
      - "5432:5432"
    volumes:
      - vantage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-mysql:
    image: mysql:8.0
    container_name: vantage_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3306:3306"
    volumes:
      - vantage_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-mariadb:
    image: mariadb:latest
    container_name: vantage_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_db
    ports:
      - "3307:3306"
    volumes:
      - vantage_mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vantage-backend:
    build: ./backend
    container_name: vantage_backend
    ports:
      - "8080:8000"
    environment:

      - ADMIN_DB_URL=sqlite:////data/admin.db
      - ADMIN_DB_PATH=/data/admin.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 2G

    volumes:
      - ./backend:/app
      - vantage_admin_data:/data
    restart: unless-stopped

  vantage-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: vantage_frontend
    ports:
      - "5173:80"
    environment:
      - PORT=80
    depends_on:
      - vantage-backend
    restart: unless-stopped

volumes:
  vantage_pg_data:
  vantage_mysql_data:
  vantage_mariadb_data:
  vantage_admin_data:
