# =============================================================================
# Vantage AI — Production Docker Compose
#
# This is the production-hardened version for on-premise deployments.
# All secrets come from the .env file (org-managed, never committed).
#
# Usage:
#   cp .env.template .env   # fill in your values
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # -------------------------------------------------------------------------
  # Reverse Proxy — Traefik
  # Handles TLS termination, routing, and rate limiting.
  # No backend/frontend port is directly exposed to the host.
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: vantage_traefik
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP → HTTPS (disable if terminating TLS upstream)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt automatic certificates
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Access log
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - vantage_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # PostgreSQL — Admin Database
  # Stores organizations, API keys, query history.
  # -------------------------------------------------------------------------
  vantage-db:
    image: postgres:15-alpine
    container_name: vantage_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SYS_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SYS_ADMIN_PASSWORD:?Set POSTGRES_SYS_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vantage_admin}
    volumes:
      - vantage_pg_data:/var/lib/postgresql/data
    networks:
      - vantage_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SYS_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # No port exposed to host — only accessible via internal network

  # -------------------------------------------------------------------------
  # Backend — FastAPI
  # -------------------------------------------------------------------------
  vantage-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vantage_backend
    restart: always
    env_file:
      - .env
    environment:
      - ADMIN_DB_URL=postgresql://${POSTGRES_SYS_ADMIN_USER:-postgres}:${POSTGRES_SYS_ADMIN_PASSWORD}@vantage-db:5432/${POSTGRES_DB:-vantage_admin}
      - DIRECT_URL=postgresql://${POSTGRES_SYS_ADMIN_USER:-postgres}:${POSTGRES_SYS_ADMIN_PASSWORD}@vantage-db:5432/${POSTGRES_DB:-vantage_admin}
      - POSTGRES_HOST=vantage-db
      - POSTGRES_PORT=5432
      - ENVIRONMENT=production
      - BACKEND_URL=http://vantage-backend:8000
    depends_on:
      vantage-db:
        condition: service_healthy
    networks:
      - vantage_net
    labels:
      - "traefik.enable=true"
      # API route
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Direct API access (no /api prefix — for existing clients)
      - "traefik.http.routers.backend-direct.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.backend-direct.entrypoints=websecure"
      - "traefik.http.routers.backend-direct.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-direct.loadbalancer.server.port=8000"
      # Rate limiting
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.backend.middlewares=backend-ratelimit"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"

  # -------------------------------------------------------------------------
  # Frontend — Nginx + Vite build
  # -------------------------------------------------------------------------
  vantage-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://${DOMAIN_NAME}/api
    container_name: vantage_frontend
    restart: always
    environment:
      - PORT=80
    depends_on:
      - vantage-backend
    networks:
      - vantage_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # GZIP compression
      - "traefik.http.middlewares.frontend-compress.compress=true"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"
      # Security headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # -------------------------------------------------------------------------
  # Monitoring — Prometheus + Grafana (optional)
  # Set ENABLE_MONITORING=true in .env to activate
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: vantage_prometheus
    restart: always
    profiles:
      - monitoring
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vantage_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:latest
    container_name: vantage_grafana
    restart: always
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=https://${DOMAIN_NAME}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - vantage_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vantage_node_exporter
    restart: always
    profiles:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - vantage_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  vantage_pg_data:
    driver: local
  traefik_letsencrypt:
    driver: local
  traefik_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  vantage_net:
    driver: bridge
